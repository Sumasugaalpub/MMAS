<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMAS Admin — Solar Linear icon options</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
:root{--brand:#1B86C4;--brand-soft:#E9F5FC;--ink:#12212e;--muted:#6b7a88;--line:#e6edf3;--page:#F4F8FB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--page);color:var(--ink);padding:28px 26px 60px}
h1{font-size:22px;font-weight:800}
.sub{font-size:13px;color:var(--muted);margin:6px 0 22px}
.grp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px 20px;margin-bottom:18px}
.grp h2{font-size:14px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.grp h2 .tag{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--brand-soft);border-radius:20px;padding:2px 10px;letter-spacing:.03em}
.row{display:flex;flex-wrap:wrap;gap:12px}
.opt{width:118px;border:1px solid var(--line);border-radius:12px;padding:14px 8px 10px;text-align:center;cursor:pointer;transition:.14s;background:#fff}
.opt:hover{border-color:var(--brand);box-shadow:0 8px 18px rgba(27,134,196,.14);transform:translateY(-2px)}
.opt .box{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 9px}
.opt .box iconify-icon{font-size:24px}
.opt .nm{font-size:10px;color:var(--muted);word-break:break-all;line-height:1.35}
.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none}
.hint.on{opacity:1}
</style>
</head>
<body>
<h1>Solar Linear icon options — MMAS Admin menu</h1>
<div class="sub">Tap any icon to copy its name. Then tell me which one you want for each menu item (e.g. "Finance → solar:banknote-2-linear").</div>
<div id="root"></div>
<div class="hint" id="hint">Copied!</div>
<script>
var GROUPS=[
 ['Overview / Dashboard','SECTION + item',['solar:widget-5-linear','solar:home-smile-linear','solar:home-2-linear','solar:pie-chart-2-linear','solar:layers-minimalistic-linear','solar:posts-carousel-vertical-linear']],
 ['Reports & Analytics','item',['solar:chart-square-linear','solar:chart-2-linear','solar:graph-up-linear','solar:pie-chart-linear','solar:diagram-up-linear']],
 ['Applications / Inbox','section + item',['solar:inbox-linear','solar:inbox-in-linear','solar:documents-linear','solar:clipboard-list-linear','solar:folder-with-files-linear','solar:tray-linear']],
 ['Accreditation / Cards & Licenses','section + item',['solar:card-linear','solar:card-2-linear','solar:user-id-linear','solar:diploma-linear','solar:diploma-verified-linear','solar:ticket-linear']],
 ['Events','section + item',['solar:calendar-linear','solar:calendar-mark-linear','solar:calendar-date-linear','solar:confetti-linear','solar:ticket-sale-linear']],
 ['Finance / Fees & Payments','section + item',['solar:wallet-money-linear','solar:wallet-linear','solar:card-transfer-linear','solar:dollar-minimalistic-linear','solar:hand-money-linear','solar:banknote-2-linear','solar:bill-list-linear']],
 ['Integrity / Fraud Reports','section + item',['solar:shield-warning-linear','solar:shield-cross-linear','solar:danger-triangle-linear','solar:flag-linear','solar:bug-linear','solar:eye-scan-linear']],
 ['Records / Database','section + item',['solar:database-linear','solar:folder-with-files-linear','solar:archive-linear','solar:server-linear','solar:library-linear']],
 ['Administration / Users & Roles','section + item',['solar:users-group-rounded-linear','solar:user-id-linear','solar:shield-user-linear','solar:settings-linear','solar:key-minimalistic-linear','solar:lock-keyhole-linear']],
 ['Activity Log','item',['solar:history-linear','solar:clock-circle-linear','solar:document-text-linear','solar:list-check-linear','solar:notes-linear']],
 ['Extras (logout / search / bell / collapse)','topbar/rail',['solar:logout-3-linear','solar:magnifer-linear','solar:bell-linear','solar:siderbar-linear','solar:moon-linear','solar:alt-arrow-down-linear']]
];
var root=document.getElementById('root'),hint=document.getElementById('hint'),ht;
GROUPS.forEach(function(g){
  var el=document.createElement('div');el.className='grp';
  var opts=g[2].map(function(ic){return '<div class="opt" data-ic="'+ic+'"><div class="box"><iconify-icon icon="'+ic+'"></iconify-icon></div><div class="nm">'+ic.replace('solar:','')+'</div></div>';}).join('');
  el.innerHTML='<h2>'+g[0]+' <span class="tag">'+g[1]+'</span></h2><div class="row">'+opts+'</div>';
  root.appendChild(el);
});
root.addEventListener('click',function(e){var o=e.target.closest('.opt');if(!o)return;var ic=o.getAttribute('data-ic');
  try{navigator.clipboard.writeText(ic);}catch(_){}
  hint.textContent='Copied: '+ic;hint.classList.add('on');clearTimeout(ht);ht=setTimeout(function(){hint.classList.remove('on');},1400);
});
</script>
</body>
</html>
