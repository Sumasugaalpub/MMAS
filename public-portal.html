<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMAS — Public Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1B86C4;--brand-2:#2A9BD8;--brand-deep:#0C5C8C;--brand-soft:#E9F5FC;--brand-bd:#B7DEF2;--ring:#8CC6E8;
  --navy:#0E2A3E;--page:#F4F8FB;--card-border:#e6edf2;--line:#eef3f7;
  --value:#12212e;--muted:#7d8b98;--muted2:#a7b3bd;--icon:#93a2ae;
  --green:#0BA65C;--green-soft:#E4F7EE;--amber:#E6A52B;--amber-soft:#FCF3E1;
  --red:#E5484D;--red-soft:#FDEAEA;--blue:#2563eb;--blue-soft:#EAF1FE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;color:var(--value);background:var(--page)}
svg{display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
img.logo{object-fit:cover;border-radius:50%}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;transition:transform .12s,box-shadow .12s,background .12s}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:0 8px 18px rgba(27,134,196,.26)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(27,134,196,.32)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand-bd)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.soft:hover{background:#daedf9}
.btn.green{background:linear-gradient(135deg,#14b56a,#0BA65C);color:#fff;box-shadow:0 8px 18px rgba(11,166,92,.26)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f4c4c4}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn.lg{padding:14px 22px;font-size:15px}

/* ============ badges ============ */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%}
.badge.sub{background:var(--blue-soft);color:#1d4ed8}.badge.sub::before{background:#2563eb}
.badge.rev{background:var(--amber-soft);color:#b45309}.badge.rev::before{background:var(--amber)}
.badge.app{background:var(--green-soft);color:#15803d}.badge.app::before{background:var(--green)}
.badge.rej{background:var(--red-soft);color:#b91c1c}.badge.rej::before{background:var(--red)}
.badge.act{background:var(--green-soft);color:#15803d}.badge.act::before{background:var(--green)}
.badge.exp{background:#eef1f4;color:#5b6773}.badge.exp::before{background:#9aa4af}
.badge.susp{background:var(--red-soft);color:#b91c1c}.badge.susp::before{background:var(--red)}

/* ============ cards ============ */
.tile{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:20px}
.sec-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);margin-bottom:12px}

/* ============ PRE-AUTH TOP BAR ============ */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.appbar .brand{display:flex;align-items:center;gap:11px}
.appbar .brand img{width:40px;height:40px;border:2px solid var(--ring)}
.appbar .brand .bt{font-size:16px;font-weight:800}
.appbar .brand .bs{font-size:10.5px;color:var(--muted)}
.appbar .abnav{margin-left:auto;display:flex;align-items:center;gap:8px}
.appbar .abnav .lnk{font-size:13.5px;font-weight:600;color:#43525e;padding:9px 13px;border-radius:9px}
.appbar .abnav .lnk:hover{background:var(--brand-soft);color:var(--brand)}
@media(max-width:640px){.appbar .brand .bs{display:none}.appbar{padding:12px 16px}.appbar .abnav .lnk.hideM{display:none}}

/* ============ LANDING ============ */
.wrap{max-width:1080px;margin:0 auto;padding:0 26px}
.hero{text-align:center;padding:64px 20px 40px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-deep);font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:20px;margin-bottom:22px}
.hero h1{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em;max-width:760px;margin:0 auto}
.hero p{font-size:16px;color:var(--muted);margin:20px auto 30px;max-width:600px;line-height:1.6}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media(max-width:640px){.hero h1{font-size:32px}.hero{padding:40px 10px 26px}}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 0 10px}
@media(max-width:900px){.services{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.services{grid-template-columns:1fr}}
.svc{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:22px;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
.svc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(14,42,62,.10);border-color:var(--brand-bd)}
.svc .ic{width:48px;height:48px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:14px}
.svc .ic svg{width:24px;height:24px}
.svc h3{font-size:15.5px;font-weight:700}
.svc p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:10px 0}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.step{text-align:center;padding:20px}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;margin:0 auto 14px}
.step h4{font-size:15px;font-weight:700}.step p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.block-h{text-align:center;margin:40px 0 8px}
.block-h .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.block-h h2{font-size:28px;font-weight:800;margin-top:8px}
.foot{margin-top:50px;border-top:1px solid var(--line);padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.foot .lang{display:inline-flex;gap:6px;margin-top:12px}
.foot .lang span{padding:5px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.foot .lang span.on{background:var(--brand-soft);color:var(--brand)}
.fees{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 0 10px}@media(max-width:760px){.fees{grid-template-columns:1fr}}.feecard{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:22px;text-align:left}.feecard .ft{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.feecard .ft h3{font-size:15px;font-weight:700}.feecard .amt{font-size:20px;font-weight:800;color:var(--brand-deep);white-space:nowrap}.feecard ul{list-style:none;margin:0;padding:0}.feecard li{font-size:12.5px;color:var(--muted);padding:8px 0 8px 20px;position:relative;line-height:1.4;border-top:1px solid var(--line)}.feecard li:first-child{border-top:none}.feecard li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--brand)}.faq{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px 0 10px}@media(max-width:760px){.faq{grid-template-columns:1fr}}.faqi{background:#fff;border:1px solid var(--card-border);border-radius:14px;padding:18px 20px;text-align:left}.faqi h4{font-size:14px;font-weight:700;margin-bottom:6px}.faqi p{font-size:12.5px;color:var(--muted);line-height:1.55}.contact{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:16px 0 0}.contact a,.contact .ci{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--value);font-weight:600;text-decoration:none;background:var(--brand-soft);padding:11px 16px;border-radius:12px}.contact svg{width:16px;height:16px;color:var(--brand)}

/* ============ AUTH CARD ============ */
.authpage{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:30px 18px}
.authcard{width:100%;max-width:460px;background:#fff;border:1px solid var(--card-border);border-radius:20px;box-shadow:0 20px 50px rgba(14,42,62,.10);padding:30px 30px 24px}
.authcard .ah{text-align:center;margin-bottom:20px}
.authcard .ah img{width:52px;height:52px;border:3px solid var(--ring);margin:0 auto 10px}
.authcard .ah h2{font-size:20px;font-weight:800}
.authcard .ah p{font-size:13px;color:var(--muted);margin-top:5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#40505c;margin-bottom:7px}
.inp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--card-border);border-radius:11px;padding:0 13px;background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,134,196,.12)}
.inp svg{width:17px;height:17px;color:var(--icon);flex-shrink:0}
.inp input,.inp select{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;color:var(--value);padding:12px 0;background:transparent}
.inp.bad{border-color:var(--red);background:#fef6f6}
.err-msg{font-size:11.5px;color:var(--red);margin-top:5px;font-weight:600;display:none}
.field.showerr .err-msg{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.radios{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.radio{display:flex;align-items:center;gap:11px;border:1.5px solid var(--card-border);border-radius:11px;padding:11px 13px;cursor:pointer}
.radio.sel{border-color:var(--brand);background:var(--brand-soft)}
.radio .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--card-border);flex-shrink:0;position:relative}
.radio.sel .rd{border-color:var(--brand)}
.radio.sel .rd::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--brand)}
.radio .rt{font-size:13.5px;font-weight:600}
.linkrow{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
.linkrow a{color:var(--brand);font-weight:700}
.frow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
.frow .rem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#40505c;cursor:pointer}
.frow .rem .box{width:16px;height:16px;border:1.6px solid var(--card-border);border-radius:5px}
.frow .rem .box.on{background:var(--brand);border-color:var(--brand)}
.frow a{font-size:12.5px;color:var(--brand);font-weight:700}

/* ============ APP SHELL ============ */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.sidebar .sb-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.sidebar .sb-brand img{width:38px;height:38px;border:2px solid var(--ring)}
.sidebar .sb-brand .bt{font-size:15px;font-weight:800}
.sidebar .sb-brand .bs{font-size:10px;color:var(--muted)}
.sidebar nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:#54636f;font-size:13.5px;font-weight:600;position:relative}
.sidebar nav a svg{width:19px;height:19px;color:var(--icon);flex-shrink:0}
.sidebar nav a:hover{background:var(--page);color:var(--value)}
.sidebar nav a.on{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(27,134,196,.26)}
.sidebar nav a.on svg{color:#fff}
.sidebar nav a .nbdot{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px}
.sidebar .sb-foot a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:#54636f;font-size:13.5px;font-weight:600}
.sidebar .sb-foot a:hover{background:var(--red-soft);color:var(--red)}
.sidebar .sb-foot a svg{width:19px;height:19px}

.mainarea{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.topbar .mburg{display:none;width:38px;height:38px;border:1px solid var(--card-border);border-radius:10px;background:#fff;place-items:center;color:var(--value)}
.topbar .mburg svg{width:20px;height:20px}
.topbar .pt{font-size:18px;font-weight:800}
.topbar .pt span{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.topbar .tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{width:40px;height:40px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;color:var(--icon);background:#fff;position:relative}
.bell:hover{background:var(--brand-soft);color:var(--brand)}
.bell svg{width:18px;height:18px}
.bell .nd{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.ubox{display:flex;align-items:center;gap:9px;border:1px solid var(--card-border);border-radius:999px;padding:5px 12px 5px 5px;background:#fff}
.ubox .uav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand-deep));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.ubox .un{font-size:12.5px;font-weight:700}.ubox .ur{font-size:10.5px;color:var(--muted)}
@media(max-width:640px){.ubox .um{display:none}}
.content{flex:1;padding:24px 26px 90px}
.content-narrow{max-width:920px;margin:0 auto}

/* notif dropdown */
.notifdrop{position:absolute;top:56px;right:26px;width:340px;background:#fff;border:1px solid var(--card-border);border-radius:16px;box-shadow:0 20px 50px rgba(14,42,62,.16);z-index:30;overflow:hidden}
.notifdrop .nh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.notifdrop .nh b{font-size:14px}
.notifdrop .nh a{font-size:12px;color:var(--brand);font-weight:700;cursor:pointer}
.notifdrop .ni{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line)}
.notifdrop .ni:last-child{border-bottom:none}
.notifdrop .ni .nic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.notifdrop .ni .nic svg{width:16px;height:16px}
.notifdrop .ni .ntt{font-size:12.5px;font-weight:600}
.notifdrop .ni .nsub{font-size:11.5px;color:var(--muted);margin-top:2px}
.notifdrop .ni .ntm{font-size:10.5px;color:var(--muted2);margin-top:3px}

/* bottom nav (mobile) */
.botnav{display:none}
/* scrim is a fixed overlay in ALL sizes so it never becomes a grid child of #app */
.scrim{position:fixed;inset:0;background:rgba(14,42,62,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .topbar .mburg{display:grid}
  .scrim{position:fixed;inset:0;background:rgba(14,42,62,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px 8px}
  .botnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600}
  .botnav a svg{width:22px;height:22px}
  .botnav a.on{color:var(--brand)}
  .notifdrop{right:12px;left:12px;width:auto}
}

/* dashboard */
.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.welcome h1{font-size:24px;font-weight:800}
.welcome p{font-size:13.5px;color:var(--muted);margin-top:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
@media(max-width:760px){.stats3{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:transform .14s,box-shadow .14s;display:flex;align-items:center;gap:15px}
.stat:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(14,42,62,.10)}
.stat .si{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.stat .si svg{width:24px;height:24px}
.stat .sv{font-size:28px;font-weight:800;line-height:1}
.stat .sl{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
@media(max-width:760px){.qa-grid{grid-template-columns:repeat(2,1fr)}}
.qa{background:#fff;border:1px solid var(--card-border);border-radius:14px;padding:16px;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left}
.qa:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(14,42,62,.08);border-color:var(--brand-bd)}
.qa .qi{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:12px}
.qa .qi svg{width:20px;height:20px}
.qa .qt{font-size:13.5px;font-weight:700}
.qa .qs{font-size:11.5px;color:var(--muted);margin-top:3px}

/* table */
.panel{background:#fff;border:1px solid var(--card-border);border-radius:16px;overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel .ph h3{font-size:15px;font-weight:800}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
td{font-size:13px;padding:14px 16px;border-bottom:1px solid var(--line);color:#3b424d;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--page)}
.tid{font-weight:700;color:var(--value)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .fsel{display:flex;align-items:center;gap:8px;border:1px solid var(--card-border);border-radius:10px;padding:8px 12px;background:#fff;font-size:13px}
.filters .fsel select{border:none;outline:none;font-family:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--value)}
.empty{text-align:center;padding:50px 20px}
.empty .ei{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty .ei svg{width:32px;height:32px}
.empty h3{font-size:17px;font-weight:800}.empty p{font-size:13.5px;color:var(--muted);margin:8px 0 18px}

/* wizard */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:26px}
.stepper .st{display:flex;align-items:center;gap:10px;flex:1}
.stepper .st .sn{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--card-border);color:var(--muted);font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.stepper .st.on .sn{background:var(--brand);border-color:var(--brand);color:#fff}
.stepper .st.done .sn{background:var(--green);border-color:var(--green);color:#fff}
.stepper .st .sl{font-size:12.5px;font-weight:700;color:var(--muted)}
.stepper .st.on .sl,.stepper .st.done .sl{color:var(--value)}
.stepper .bar{height:2px;background:var(--card-border);flex:1;margin:0 6px}
.stepper .bar.fill{background:var(--green)}
@media(max-width:600px){.stepper .st .sl{display:none}}
.wiznav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.upload{border:1.5px dashed var(--brand-bd);border-radius:13px;padding:18px;text-align:center;background:var(--brand-soft);cursor:pointer;transition:background .14s}
.upload:hover{background:#daedf9}
.upload.upreq{border-color:var(--red);background:#fef6f6}
.upreq-msg{font-size:11.5px;color:var(--red);font-weight:600;margin-top:5px;display:none}
.upload .ui{width:40px;height:40px;border-radius:11px;background:#fff;color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
.upload .ui svg{width:20px;height:20px}
.upload .ut{font-size:13px;font-weight:700}.upload .us{font-size:11.5px;color:var(--muted);margin-top:3px}
.upfile{display:flex;align-items:center;gap:11px;border:1px solid var(--card-border);border-radius:12px;padding:11px 13px;margin-top:8px}
.upfile .uth{width:38px;height:38px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.upfile .uth svg{width:18px;height:18px}
.upfile .ufn{font-size:12.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upfile .ufs{font-size:11px;color:var(--muted)}
.upfile .ux{width:26px;height:26px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.upfile .ux svg{width:14px;height:14px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.dynrow{display:grid;gap:8px;margin-bottom:8px}
.dynrow.eq{grid-template-columns:1fr 120px 40px}
.dynrow.tm{grid-template-columns:1fr 1fr 1fr 40px}
@media(max-width:640px){.dynrow.eq,.dynrow.tm{grid-template-columns:1fr}}
.rmrow{width:100%;height:44px;border-radius:10px;background:var(--red-soft);color:var(--red);border:none;display:grid;place-items:center}
.rmrow svg{width:16px;height:16px}

/* wallet cards */
.wallet{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:720px){.wallet{grid-template-columns:1fr}}
.idcard{border-radius:18px;padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-deep),var(--brand) 70%,var(--brand-2));box-shadow:0 14px 30px rgba(12,92,140,.28);cursor:pointer}
.idcard.expcard{background:linear-gradient(135deg,#5b6773,#8794a1)}
.idcard .icr{position:absolute;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.14);right:-70px;top:-70px}
.idcard .ictop{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;margin-bottom:22px}
.idcard .ictop .ictype{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
.idcard .icbadge{font-size:10.5px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px}
.idcard .icname{font-size:19px;font-weight:800;position:relative;z-index:1}
.idcard .icout{font-size:12.5px;opacity:.85;position:relative;z-index:1;margin-top:2px}
.idcard .icbot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;position:relative;z-index:1}
.idcard .icid{font-size:12.5px;font-family:monospace;letter-spacing:.5px;opacity:.9}
.idcard .icexp{font-size:11px;opacity:.8}.idcard .icexp b{display:block;font-size:13px;opacity:1}
.wcard-actions{display:flex;gap:8px;margin-top:12px}

/* big card detail */
.bigcard{max-width:420px;margin:0 auto}
.bigcard .idcard{padding:26px}
.qrbox{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:22px;text-align:center;margin-top:18px}
.qrbox svg{margin:0 auto}
.detrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.detrow:last-child{border-bottom:none}
.detrow .dl{color:var(--muted);font-weight:600}.detrow .dv{font-weight:700}

/* timeline */
.timeline{position:relative;padding-left:8px}
.tlitem{display:flex;gap:14px;padding-bottom:22px;position:relative}
.tlitem:last-child{padding-bottom:0}
.tlitem .tld{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;z-index:1}
.tlitem .tld svg{width:15px;height:15px}
.tlitem::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.tlitem:last-child::before{display:none}
.tlitem.ok .tld{background:var(--green);color:#fff}
.tlitem.cur .tld{background:var(--brand);color:#fff}
.tlitem.wait .tld{background:#fff;border:2px solid var(--card-border);color:var(--muted2)}
.tlitem .tlt{font-size:14px;font-weight:700}
.tlitem .tls{font-size:12px;color:var(--muted);margin-top:2px}

/* events */
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.evgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.evgrid{grid-template-columns:1fr}}
.evcard{background:#fff;border:1px solid var(--card-border);border-radius:16px;overflow:hidden}
.evcard .evimg{height:120px;display:grid;place-items:center;color:#fff}
.evcard .evimg svg{width:44px;height:44px;opacity:.9}
.evcard .evb{padding:16px}
.evcard h3{font-size:15px;font-weight:800}
.evmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.evmeta svg{width:14px;height:14px}

/* pass ticket */
.ticket{max-width:400px;margin:0 auto;background:#fff;border:1px solid var(--card-border);border-radius:18px;overflow:hidden}
.ticket .tkt-top{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;padding:22px}
.ticket .tkt-top h3{font-size:18px;font-weight:800}
.ticket .tkt-body{padding:22px;text-align:center}
.ticket .perf{border-top:2px dashed var(--card-border);position:relative}

/* notifications page */
.notif-day{font-size:12px;font-weight:800;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
.notif-item{display:flex;gap:13px;background:#fff;border:1px solid var(--card-border);border-radius:13px;padding:14px 16px;margin-bottom:9px;align-items:flex-start}
.notif-item.unread{border-left:3px solid var(--brand)}
.notif-item .nc{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.notif-item .nc svg{width:18px;height:18px}
.notif-item .nt{font-size:13.5px;font-weight:700}
.notif-item .ns{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.notif-item .ntm{font-size:11px;color:var(--muted2);margin-top:5px}
.notif-item .ndel{margin-left:auto;color:var(--muted2);cursor:pointer;opacity:0;transition:opacity .15s}
.notif-item:hover .ndel{opacity:1}
.notif-item .ndel svg{width:16px;height:16px}

/* tabs */
.tabs{display:flex;gap:4px;background:#eef3f7;border-radius:12px;padding:4px;margin-bottom:20px;max-width:420px}
.tabs button{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:9px;border-radius:9px}
.tabs button.on{background:#fff;color:var(--value);box-shadow:0 1px 3px rgba(14,42,62,.1)}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(14,42,62,.45);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:440px;background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(14,42,62,.3);padding:26px;transform:translateY(10px);transition:transform .18s}
.overlay.on .modal{transform:translateY(0)}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.modal .mh h3{font-size:18px;font-weight:800}
.modal .mx{width:30px;height:30px;border-radius:9px;background:var(--page);display:grid;place-items:center;color:var(--muted);border:none}
.modal .mx svg{width:16px;height:16px}
.modal p.msub{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.modal .micon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 14px}
.modal .micon svg{width:28px;height:28px}
.otpboxes{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otpboxes input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:800;border:1.5px solid var(--card-border);border-radius:11px;outline:none}
.otpboxes input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,134,196,.12)}
.resend{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.resend b{color:var(--brand)}
.cropper{background:var(--navy);border-radius:14px;height:200px;display:grid;place-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.cropper .cc{width:130px;height:130px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 999px rgba(14,42,62,.55);display:grid;place-items:center;color:rgba(255,255,255,.6)}
.cropper .cc svg{width:40px;height:40px}
.modal-actions{display:flex;gap:10px}
.summary{background:var(--page);border-radius:13px;padding:16px;margin-bottom:18px}
.summary .sr{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.summary .sr.tot{border-top:1px dashed var(--card-border);margin-top:6px;padding-top:10px;font-weight:800;font-size:15px}
.paymethod{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}

/* toast */
#toasts{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:12px;padding:12px 14px;min-width:300px;max-width:460px;box-shadow:0 8px 26px rgba(14,42,62,.12);transform:translateX(120%);opacity:0;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s;background:#E4F7EE;border-color:#BFEAD5}
.toast.show{transform:translateX(0);opacity:1}
.toast.info{background:#EAF2FE;border-color:#C6D9F6}
.toast.warn{background:#FBF3DD;border-color:#F1DFA6}
.toast.err{background:#FCECEC;border-color:#F6CDCE}
.toast .ti{flex-shrink:0;display:grid;place-items:center;color:#0BA65C}
.toast.info .ti{color:#2f6bd8}
.toast.warn .ti{color:#D69B1F}
.toast.err .ti{color:#E0484D}
.toast .ti svg{width:19px;height:19px}
.toast .tc{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px}
.toast .tt{font-size:13.5px;font-weight:700;color:#0d6b45}
.toast.info .tt{color:#1c3d78}
.toast.warn .tt{color:#7d5608}
.toast.err .tt{color:#9e2b2f}
.toast .tsub{font-size:13px;color:var(--muted);font-weight:500}
.toast .tact{font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap;color:#0d6b45}
.toast.info .tact{color:#1c3d78}.toast.warn .tact{color:#7d5608}.toast.err .tact{color:#9e2b2f}
.toast .tx{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px;display:grid;place-items:center;flex-shrink:0;border-radius:6px;margin-left:2px}
.toast .tx:hover{background:rgba(14,42,62,.08)}
.toast .tx svg{width:15px;height:15px}

/* skeleton */
.skel{background:linear-gradient(90deg,#eef3f7 25%,#e3ebf1 50%,#eef3f7 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:34px;height:34px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* ============================================================
   RESPONSIVE ENHANCEMENTS  (layout only — colors/fonts/spacing unchanged)
   Everything here is inside media queries or is overflow-safe,
   so desktop rendering is untouched.
   ============================================================ */
html,body{max-width:100%;overflow-x:hidden}
img,svg,video{max-width:100%}
.idcard,.qrbox,.ticket,.bigcard{max-width:100%}
.tablewrap{-webkit-overflow-scrolling:touch}
.hero h1{font-size:clamp(28px,7vw,44px)}
/* Tablet & below: touch-friendly targets + no iOS input zoom */
@media(max-width:900px){
  .sidebar nav a,.nav a,.botnav a{min-height:44px}
  .content{padding:18px 16px 96px}
  .topbar{padding:12px 16px}
}
/* iOS zoom guard only on real phones — keeps auth/login sizing unchanged on laptops */
@media(max-width:560px){
  .inp input,.inp select,.inp textarea,.manual input{font-size:16px}
}
/* Bottom nav = mobile only (<768). Hide on tablet portrait; add iPhone safe-area */
@media(min-width:768px) and (max-width:860px){ .botnav{display:none!important} .content{padding-bottom:24px} }
@media(max-width:767px){ .botnav{padding-bottom:calc(8px + env(safe-area-inset-bottom))!important} .content{padding-bottom:calc(90px + env(safe-area-inset-bottom))} }
/* Grids stack cleanly at small widths */
@media(max-width:760px){ .qa-grid{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr} .content-narrow .grid2{grid-template-columns:1fr} }
@media(max-width:460px){ .qa-grid{grid-template-columns:1fr} .wallet{grid-template-columns:1fr} }
/* Wizard: stepper scrolls sideways if tight; nav buttons go full-width */
@media(max-width:600px){
  .stepper{overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch}
  .wiznav{flex-direction:column-reverse;gap:10px}
  .wiznav .btn{width:100%}
}
/* Modals: fit small screens, scroll if tall, larger close target (kept centred) */
@media(max-width:560px){
  .overlay{padding:12px}
  .modal{max-width:100%;width:100%;max-height:90vh;overflow-y:auto}
  .modal .mx{width:38px;height:38px}
  .otpboxes input{width:40px;height:48px}
  .modal-actions .btn{flex:1}
}
/* Toasts: full width on phones, clear of the status bar */
@media(max-width:560px){
  #toasts{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top))}
  .toast{min-width:0;width:100%}
}
/* Filters + panel headers wrap on phones */
@media(max-width:560px){
  .filters{flex-direction:column;align-items:stretch}
  .filters .fsel{width:100%}
  .panel .ph{flex-wrap:wrap;gap:8px}
  .authcard{padding:24px 18px}
}

/* ============ MAPPLE-STYLE LANDING (ministry blue) ============ */
.mp{max-width:1200px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.mp .sec{padding:64px 40px;border-bottom:1px solid var(--line)}
@media(max-width:720px){.mp .sec{padding:44px 20px}}
.mp .center{text-align:center;max-width:720px;margin:0 auto}
.mp .kicker{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--title);margin-bottom:22px}
.mp .kicker svg{width:17px;height:17px;color:var(--brand)}
.mp h1.mp-h{font-size:clamp(28px,4vw,42px);font-weight:500;line-height:1.05;letter-spacing:-.02em;color:var(--title)}
.mp h1.mp-h .hl{color:inherit}
.mp h2.mp-h{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.015em;color:var(--title)}
.mp .lead{max-width:600px;font-size:16.5px;color:var(--muted);line-height:1.6;margin:20px auto 0;max-width:560px}
.mp-hero .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.mp-hero .rate{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:34px;font-size:14px;color:var(--muted);font-weight:600}
.mp-hero .stars{color:#F5B400;letter-spacing:2px;font-size:15px}
.mp-hero .rate b{color:var(--brand);font-weight:800}
/* trusted-by */
.mp-trust{display:flex;align-items:center;gap:28px;max-width:1120px;margin:0 auto}
.mp-trust .lab{font-size:16px;color:var(--muted);font-weight:600;white-space:nowrap;flex:none}
.mp-marquee{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mp-track{display:flex;align-items:center;gap:64px;width:max-content;animation:mpscroll 30s linear infinite}
.mp-track:hover{animation-play-state:paused}
.mp-trust .tlogo{height:40px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.5;flex:none}
@keyframes mpscroll{to{transform:translateX(calc(-50% - 32px))}}
@media(max-width:640px){.mp-trust{gap:16px}.mp-trust .tlogo{height:30px}}
/* feature grid */
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media(max-width:820px){.mp-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.mp-grid{grid-template-columns:1fr}}
.mp-feat{padding:34px 30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mp-feat .tile{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;line-height:0;margin-bottom:20px}
.mp-feat .tile svg{width:26px;height:26px}
.mp-feat h3{font-size:19px;font-weight:700;color:var(--title)}
.mp-feat p{font-size:14px;color:var(--muted);line-height:1.55;margin-top:10px}
/* gallery */
.mp-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
@media(max-width:820px){.mp-gal{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.mp-gal{grid-template-columns:1fr}}
.mp-shot{aspect-ratio:16/11;border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;box-shadow:0 12px 30px rgba(14,42,62,.10)}
.mp-shot .gi{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.mp-shot .gi svg{width:20px;height:20px;color:#fff}
.mp-shot .cap{font-size:15px;font-weight:700;position:relative}
.mp-shot .sub{font-size:12px;opacity:.85;position:relative;margin-top:2px}
.mp-shot.g1{background:linear-gradient(140deg,#1B86C4,#0C5C8C)}
.mp-shot.g2{background:linear-gradient(140deg,#2A9BD8,#127C9E)}
.mp-shot.g3{background:linear-gradient(140deg,#0E2A3E,#1B86C4)}
.mp-shot.g4{background:linear-gradient(140deg,#12897E,#0C5C8C)}
.mp-shot.g5{background:linear-gradient(140deg,#0C5C8C,#2A9BD8)}
.mp-shot.g6{background:linear-gradient(140deg,#1B86C4,#12897E)}
/* testimonials */
.mp-testi{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:820px){.mp-testi{grid-template-columns:1fr}}
.mp-tlist{border-right:1px solid var(--line)}
@media(max-width:820px){.mp-tlist{border-right:none}}
.mp-trow{display:flex;align-items:center;gap:16px;padding:22px 26px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s}
.mp-trow:hover{background:#fbfcfd}
.mp-trow.on{background:var(--brand-soft)}
.mp-trow .av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.mp-trow .nm{font-size:17px;font-weight:700;color:var(--title)}
.mp-trow .hd{font-size:13.5px;color:var(--muted)}
.mp-tdet{padding:30px 40px;display:flex;flex-direction:column;justify-content:center}
.mp-tdet .stars{color:#F5B400;letter-spacing:3px;font-size:20px}
.mp-tdet .q{font-size:20px;font-weight:700;font-style:italic;color:var(--title);margin:18px 0 14px}
.mp-tdet .body{font-size:15px;color:var(--muted);line-height:1.7}
.mp-tdet .more{display:inline-flex;align-items:center;gap:7px;margin-top:20px;font-size:14px;font-weight:700;color:var(--brand);cursor:pointer}
.mp-tdet .more svg{width:16px;height:16px}
/* faq */
.mp-faqwrap{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:820px){.mp-faqwrap{grid-template-columns:1fr;gap:20px}}
.mp-faql{padding-right:40px}
.mp-faql h2{margin-bottom:16px}
.mp-faql p{font-size:15px;color:var(--muted);line-height:1.7}
.mp-acc .qi{border-bottom:1px solid var(--line)}
.mp-acc .qh{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 4px;cursor:pointer;font-size:16px;font-weight:600;color:var(--title)}

/* ===== Cross-portal bridge (reads Admin Portal data) ===== */
function pubBridge(){ try{return JSON.parse(localStorage.getItem('mmas_bridge_status')||'{}');}catch(e){return {};} }
function applyBridge(){
  var b=pubBridge();
  (APPS||[]).forEach(function(a){ var v=b['app:'+a.id]; if(v){ a.status=v.status; if(v.reason)a.reason=v.reason; } });
  (CARDS||[]).forEach(function(c){ var v=b['card:'+c.id]; if(v){ c.status=v.status; } });
  try{ var af=JSON.parse(localStorage.getItem('mmas_admin_fees')||'null'); if(af&&af.length){ af.forEach(function(x){ if(/Press Card/i.test(x.service))FEES['Press Card']=x.amount; else if(/Foreign/i.test(x.service))FEES['Foreign Permit']=x.amount; else if(/Radio/i.test(x.service))FEES['Media License']=x.amount; }); } }catch(e){}
  try{ var _nc=JSON.parse(localStorage.getItem('mmas_bridge_new_cards')||'[]'); _nc.forEach(function(c){ if(c.holder===USER.name && !(CARDS||[]).some(function(x){return x.id===c.id;})){ CARDS.push({id:c.id,type:c.type,holder:USER.name,status:c.status||'Active',expiry:c.expiry||'31 Dec 2027',outlet:USER.outlet}); } }); }catch(e){}
  try{ var _nn=JSON.parse(localStorage.getItem('mmas_bridge_notifs')||'[]'); _nn.forEach(function(n){ if(n.who===USER.name){ var dup=(NOTIFS||[]).some(function(x){return x.t===n.t && x.link && n.link && x.link.id===n.link.id;}); if(!dup){ NOTIFS.unshift({icon:n.icon||'check',color:n.color||'green',t:n.t,s:n.s,tm:'just now',day:'Today',unread:true,link:n.link}); } } }); }catch(e){}
}
function adminEvents(){
  var out=[]; try{ var ae=JSON.parse(localStorage.getItem('mmas_admin_events')||'[]'); var have={};
    (EVENTS||[]).forEach(function(e){have[e.id]=1;}); DEFAULT_EVENTS.forEach(function(e){have[e.id]=1;});
    ae.forEach(function(e){ if(!have[e.id]){ out.push({id:e.id,title:e.name,date:e.date,loc:e.loc,cap:(e.cap||100)+' seats',capNum:(e.cap||100),baseReg:(e.reg||0),g:'linear-gradient(135deg,#0C5C8C,#2A9BD8)',reg:false,fee:0,approval:'auto',audience:'All accredited media'}); have[e.id]=1; } });
  }catch(e){} return out;
}

function admDate(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function bridgeRegsCount(id){ try{return JSON.parse(localStorage.getItem('mmas_bridge_event_regs')||'[]').filter(function(r){return r.eventId===id;}).length;}catch(e){return 0;} }
function evCapNum(e){ return e.capNum || parseInt(String(e.cap),10) || 0; }
function evCount(e){ return (e.baseReg||0) + bridgeRegsCount(e.id); }
function evLeft(e){ var c=evCapNum(e); return c>0?Math.max(0,c-evCount(e)):999; }
function evFull(e){ var c=evCapNum(e); return c>0 && evCount(e)>=c; }
function capBar(e){ var c=evCapNum(e),n=evCount(e),pct=c?Math.min(100,Math.round(n/c*100)):0,full=evFull(e),almost=!full&&c&&n>=Math.ceil(c*0.8); var col=full?'var(--red)':almost?'#E6A52B':'linear-gradient(90deg,var(--brand),var(--brand-2))'; return '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px"><span>'+n+' / '+(c||'&#8734;')+' spots filled</span>'+(full?'<span style="color:var(--red);font-weight:800">FULL</span>':almost?'<span style="color:#E6A52B;font-weight:800">Almost full</span>':'')+'</div><div style="height:7px;background:var(--line);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:'+pct+'%;background:'+col+'"></i></div></div>'; }

var AUTHED=false, CURRENT='dashboard';
var PREPAGES={landing:1,login:1,signup:1,'verify-card':1,'pub-events':1};
function _savePub(p,a){try{sessionStorage.setItem('mmas_pub_page',JSON.stringify({p:p,a:(a===undefined?'':a)}));}catch(e){}}
function go(page,arg){
  closeNotif();
  if(PREPAGES[page]){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('preauth').classList.remove('hidden');
    document.getElementById('preMain').innerHTML=PRE[page]?PRE[page]():'';
    if(page==='login'){ var _s=document.getElementById('lg_acct'); fillDemo(_s?_s.value:'individual'); }
    if(page==='landing'){ try{ tRender(); selSuite(0); }catch(e){} }
    _savePub(page,arg);
    window.scrollTo(0,0);
    return;
  }
  if(!AUTHED){ go('login'); return; }
  document.getElementById('preauth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  CURRENT=page;
  _savePub(page,arg);
  var r=PAGES[page]||PAGES.dashboard;
  var out=r(arg);
  document.getElementById('main').innerHTML=out.html;
  document.getElementById('ptTitle').childNodes[0].nodeValue=out.title;
  document.getElementById('ptSub').textContent=out.sub||'';
  setActiveNav(out.nav||page);
  toggleSidebar(false);
  window.scrollTo(0,0);
  if(out.after) out.after(arg);
}

/* ============================ TOAST ============================ */
function toast(msg,type,opts){
  opts=opts||{}; if(typeof opts==='string')opts={desc:opts};
  var kind=type==='err'?'err':type==='info'?'info':(type==='warn'||type==='warning')?'warn':'ok';
  var t=document.createElement('div'); t.className='toast'+(kind==='ok'?'':' '+kind);
  var h='<span class="ti">'+toastIcon(kind)+'</span><div class="tc"><span class="tt">'+msg+'</span>'+(opts.desc?'<span class="tsub">'+opts.desc+'</span>':'')+'</div>';
  if(opts.action&&opts.action.label){h+='<a class="tact" onclick="'+(opts.action.fn||'')+'">'+opts.action.label+'</a>';}
  h+='<button class="tx" aria-label="Dismiss" onclick="var e=this.parentNode;e.classList.remove(\'show\');setTimeout(function(){e.remove();},300);">'+toastX()+'</button>';
  t.innerHTML=h; document.getElementById('toasts').appendChild(t);
  setTimeout(function(){t.classList.add('show');},30);
  setTimeout(function(){if(t.parentNode){t.classList.remove('show');setTimeout(function(){t.remove();},320);}},3800);
}
function toastIcon(k){var a='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';if(k==='info')return a+'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>';if(k==='warn')return a+'<path d="M10.3 3.9 1.7 18a2 2 0 0 0 1.7 3h17.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';if(k==='err')return a+'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';return a+'<circle cx="12" cy="12" r="9"/><path d="m8.4 12 2.5 2.5 4.7-5.2"/></svg>';}
function toastX(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';}

function typeRadio(t,sel){return '<label class="radio'+(sel?' sel':'')+'" onclick="pickType(this)"><span class="rd"></span><span class="rt">'+t+'</span></label>';}
function pickType(el){el.parentNode.querySelectorAll('.radio').forEach(function(r){r.classList.remove('sel');});el.classList.add('sel');}
function fieldHTML(id,label,icon,type,ph){
  return '<div class="field" id="f_'+id+'"><label>'+label+'</label><div class="inp">'+ic(icon)+'<input id="'+id+'" type="'+type+'" placeholder="'+ph+'"></div><div class="err-msg">This field is required</div></div>';
}
function validate(ids){var ok=true;ids.forEach(function(id){var f=document.getElementById('f_'+id),inp=document.getElementById(id);if(inp&&!inp.value.trim()){f.classList.add('showerr');f.querySelector('.inp').classList.add('bad');ok=false;}else if(f){f.classList.remove('showerr');f.querySelector('.inp').classList.remove('bad');}});return ok;}
function fieldError(id,msg){var f=document.getElementById('f_'+id);if(!f)return;var m=f.querySelector('.err-msg');if(m)m.textContent=msg;f.classList.add('showerr');f.querySelector('.inp').classList.add('bad');}
function isEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}
function isPhone(v){return /^\+?[0-9][0-9\s]{6,}$/.test(v);}
function doSignup(){
  if(!validate(['su_name','su_phone','su_email','su_pass','su_pass2'])){toast('Please fill all required fields.','err');return;}
  if(!isPhone(document.getElementById('su_phone').value.trim())){fieldError('su_phone','Enter a valid phone number');toast('Enter a valid phone number.','err');return;}
  if(!isEmail(document.getElementById('su_email').value.trim())){fieldError('su_email','Enter a valid email address');toast('Enter a valid email address.','err');return;}
  var p1=document.getElementById('su_pass').value,p2=document.getElementById('su_pass2').value;
  if(p1!==p2){toast('Passwords do not match.','err');return;}
  var _nm=document.getElementById('su_name').value;
  var _sel=document.querySelector('#acctType .radio.sel .rt');var _lab=_sel?_sel.textContent.trim():'Individual Journalist';
  var _at=_lab==='Media House'?'mediaHouse':_lab==='Foreign Media'?'foreign':'individual';
  SIGNUP={name:_nm,email:document.getElementById('su_email').value,phone:document.getElementById('su_phone').value,av:_nm.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(),acctType:_at};
  try{ var _bu=JSON.parse(localStorage.getItem('mmas_bridge_users')||'[]'); var _t=_at==='mediaHouse'?'Outlet':'Journalist'; _bu.push({name:_nm,type:_t,outlet:_t==='Outlet'?_nm:'-',id:'NEW-'+Math.floor(100000+Math.random()*899999),cards:0,apps:0}); localStorage.setItem('mmas_bridge_users',JSON.stringify(_bu)); }catch(e){}
  otpModal(function(){ accountCreatedModal(); });
}
function otpModal(onOk){
  openModal('<div class="mh"><h3>Verify your phone</h3><button class="mx" onclick="closeModal()">'+ic('x',2)+'</button></div>'+
    '<p class="msub">We sent a 6-digit code to your phone. Enter it below to continue.</p>'+
    '<div class="otpboxes">'+[0,1,2,3,4,5].map(function(i){return '<input maxlength="1" inputmode="numeric" oninput="otpHop(this,'+i+')" id="otp'+i+'">';}).join('')+'</div>'+
    '<div class="resend">Resend code in <b id="rsT">0:30</b></div>'+
    '<button class="btn pri block lg" id="otpBtn">Verify &amp; Continue</button>');
  var t=30;var iv=setInterval(function(){t--;var m=document.getElementById('rsT');if(!m){clearInterval(iv);return;}if(t<=0){m.parentNode.innerHTML='Didn\'t get it? <b style="cursor:pointer" onclick="toast(\'New code sent.\')">Resend code</b>';clearInterval(iv);}else{m.textContent='0:'+(t<10?'0':'')+t;}},1000);
  document.getElementById('otp0').focus();
  document.getElementById('otpBtn').onclick=function(){clearInterval(iv);onOk();};
}
function otpHop(el,i){if(el.value&&i<5)document.getElementById('otp'+(i+1)).focus();}

}

function collectWiz(){
  ['w_name','w_idno','w_nat','w_ltype','w_oname','w_owner','w_addr','w_contact','w_crew','w_country','w_reason','w_loc'].forEach(function(id){var el=document.getElementById(id);if(el)WIZ.data[id]=el.value;});
  if(document.getElementById('eqList')||document.getElementById('tmList'))collectDyn();
}
function wizNext(){
  var c=WIZ.cfg;
  if(WIZ.step===0){
    var req=c.kind==='press'?['w_name','w_idno']:c.kind==='license'?['w_oname','w_owner','w_addr','w_contact']:['w_crew','w_country','w_reason','w_loc'];
    if(!validate(req)){toast('Please complete all required fields.','err');return;}
  }
  if(WIZ.step===1){
    var need=c.kind==='press'?['photo','id','letter']:c.kind==='license'?['reg','ownerid']:['passport','schedule'];
    var miss=need.filter(function(f){return !WIZ.files[f];});
    if(miss.length){miss.forEach(function(f){var el=document.getElementById('up_'+f);if(el){var u=el.querySelector('.upload');if(u)u.classList.add('upreq');}});toast('Please upload all required documents.','err');return;}
  }
  collectWiz();
  WIZ.step++;renderWiz();if(c.kind==='permit'&&WIZ.step===1)renderDyn();
}
function wizBack(){collectWiz();WIZ.step--;renderWiz();if(WIZ.cfg.kind==='permit'&&WIZ.step===1)renderDyn();}
function wizSaveDraft(){collectWiz();try{localStorage.setItem('mmas_draft_'+WIZ.cfg.kind,JSON.stringify({step:WIZ.step,data:WIZ.data,dyn:WIZ.dyn,files:WIZ.files}));}catch(e){}toast('Draft saved. You can finish it later.');}
function wizSubmit(){
  collectWiz();
  var c=WIZ.cfg,d=WIZ.data,detail;
  if(c.kind==='press') detail={name:d.w_name||USER.name,idno:d.w_idno||'—',nat:d.w_nat||'Somali',outlet:USER.outlet};
  else if(c.kind==='license') detail={name:d.w_owner||d.w_oname||'—',idno:d.w_oname||'—',nat:'—',outlet:d.w_oname||'—'};
  else detail={name:d.w_crew||'—',idno:d.w_country||'—',nat:d.w_country||'—',outlet:d.w_crew||'—'};
  PENDING_APP={kind:c.kind,detail:detail,reapply:Object.assign({},d),dyn:JSON.parse(JSON.stringify(WIZ.dyn||{})),acctType:USER.type};
  confirmSubmitModal(c.type,FEES[c.type]);
}
function confirmSubmitModal(type,fee){
  openModal('<div class="mh"><h3>Confirm submission</h3><button class="mx" onclick="closeModal()">'+ic('x',2)+'</button></div>'+
    '<p class="msub">You are about to submit your '+type+' application and pay the fee.</p>'+
    '<div class="summary"><div class="sr"><span>'+type+'</span><span>$'+fee+'.00</span></div><div class="sr tot"><span>Total</span><span>$'+fee+'.00</span></div></div>'+
    '<div class="modal-actions"><button class="btn ghost block" onclick="closeModal()">Cancel</button><button class="btn green block" onclick="closeModal();startPayment(\''+type+'\','+fee+',\'app\')">Proceed to Pay</button></div>');
}

/* ============================ PAYMENT ============================ */
var PAYCTX={};
function startPayment(item,fee,back){ PAYCTX={item:item,fee:fee,back:back}; go('payment'); }
PAGES.payment=function(){
  var p=PAYCTX.item?PAYCTX:{item:'Press Card',fee:30,back:'dashboard'};
  var html='<a class="btn soft sm" onclick="go(\''+(p.back==='wallet'?'wallet':'dashboard')+'\')" style="margin-bottom:16px">'+ic('back',2)+' Cancel</a>'+
    '<div class="content-narrow"><div class="grid2" style="align-items:start;gap:16px">'+
    '<div class="tile"><div class="sec-h">Order summary</div>'+
    '<div class="summary" style="background:var(--brand-soft)"><div class="sr"><span>'+p.item+'</span><span>$'+p.fee+'.00</span></div><div class="sr"><span>Service fee</span><span>$0.00</span></div><div class="sr tot"><span>Total</span><span>$'+p.fee+'.00</span></div></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5">Payments are processed securely. You will receive a receipt once payment is confirmed.</div></div>'+
    '<div class="tile"><div class="sec-h">Payment method</div>'+
    '<div class="paymethod" id="payMethods">'+
    payRadio('EVC Plus',true)+payRadio('Mobile Money',false)+
    '</div>'+
    '<div class="field" id="f_pay_phone"><label>Phone number</label><div class="inp">'+ic('phone')+'<input id="pay_phone" value="'+USER.phone+'"></div></div>'+
    '<button class="btn green block lg" id="payBtn" onclick="doPay('+p.fee+')">Confirm Payment · $'+p.fee+'.00</button>'+
    '</div></div></div>';
  return {title:'Payment',sub:p.item,nav:'applications',html:html};
};
function payRadio(t,sel){return '<label class="radio'+(sel?' sel':'')+'" onclick="pickType(this)"><span class="rd"></span><span class="rt">'+t+'</span></label>';}
function doPay(fee){
  var btn=document.getElementById('payBtn');
  btn.innerHTML='<span class="spin" style="width:20px;height:20px;border-width:2px"></span> Processing…';btn.disabled=true;
  setTimeout(function(){ paymentSuccess(fee); },1900);
}
function paymentSuccess(fee){
  var rcp='RCP-2026-'+Math.floor(100000+Math.random()*899999);
  var evc='EVC-'+Math.floor(1000000000+Math.random()*8999999999);
  try{ var _pb=JSON.parse(localStorage.getItem('mmas_bridge_payments')||'[]'); _pb.push({rcp:rcp,payer:USER.name,amount:fee,date:admDate(),method:'EVC Plus',txn:evc}); localStorage.setItem('mmas_bridge_payments',JSON.stringify(_pb)); }catch(e){}
  // reflect: if from an application submit, add a new submitted app
  if(PAYCTX.back==='app'){
    var newId='APP-2026-0'+Math.floor(420+Math.random()*80);
    var rec={id:newId,type:PAYCTX.item,date:'12 Jul 2026',status:'Submitted'};
    if(PENDING_APP&&PENDING_APP.detail){rec.name=PENDING_APP.detail.name;rec.idno=PENDING_APP.detail.idno;rec.nat=PENDING_APP.detail.nat;rec.outlet=PENDING_APP.detail.outlet;rec.reapply=PENDING_APP.reapply;try{localStorage.removeItem('mmas_draft_'+PENDING_APP.kind);}catch(e){}}
    APPS.unshift(rec);
    try{ var _ab=JSON.parse(localStorage.getItem('mmas_bridge_new_apps')||'[]'); _ab.push({id:newId,name:rec.name||USER.name,type:PAYCTX.item,date:admDate(),status:'Submitted',outlet:rec.outlet||USER.outlet||'-',nat:rec.nat||USER.nationality||'-',idno:rec.idno||USER.idno||'-',acctType:(PENDING_APP&&PENDING_APP.acctType)||USER.type,equipment:(PENDING_APP&&PENDING_APP.dyn&&PENDING_APP.dyn.equipment)||[],team:(PENDING_APP&&PENDING_APP.dyn&&PENDING_APP.dyn.team)||[]}); localStorage.setItem('mmas_bridge_new_apps',JSON.stringify(_ab)); }catch(e){}
    PAYCTX.newAppId=newId;PENDING_APP=null;
  }
  if(PAYCTX.back==='wallet'&&RENEW_CARD){var _rc=CARDS.filter(function(x){return x.id===RENEW_CARD;})[0];if(_rc){_rc.status='Active';_rc.expiry='31 Dec 2027';}RENEW_CARD=null;}
  saveState();
  openModal('<div class="micon" style="background:var(--green-soft);color:var(--green)">'+ic('check',2.6)+'</div>'+
    '<h3 style="text-align:center">Payment successful</h3>'+
    '<p class="msub" style="text-align:center">Your payment of $'+fee+'.00 was received.</p>'+
    '<div class="summary"><div class="sr"><span>Receipt ID</span><b>'+rcp+'</b></div><div class="sr"><span>Transaction</span><b>'+evc+'</b></div><div class="sr"><span>Method</span><b>EVC Plus</b></div><div class="sr tot"><span>Paid</span><span>$'+fee+'.00</span></div></div>'+
    '<div class="modal-actions"><button class="btn ghost block" onclick="toast(\'Downloading receipt…\')">Download Receipt</button><button class="btn pri block" onclick="afterPay()">View Application</button></div>');
}
function afterPay(){closeModal();if(PAYCTX.back==='wallet'){toast('Renewal complete!');go('wallet');}else if(PAYCTX.back==='event'&&EVENT_REG){var er=EVENT_REG;EVENT_REG=null;e_reg(er.id,er.type);}else{toast('Application submitted!');go('app-detail',PAYCTX.newAppId||APPS[0].id);}}

function saveProfile(){
  var nm=document.getElementById('pf_name'); if(nm){nm=nm.value.trim();}
  if(nm){USER.name=nm;USER.first=nm.split(' ')[0];USER.av=nm.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
  var ph=document.getElementById('pf_phone'),em=document.getElementById('pf_email'),na=document.getElementById('pf_nat');
  if(ph)USER.phone=ph.value; if(em)USER.email=em.value; if(na)USER.nationality=na.value;
  document.getElementById('ubNm').textContent=USER.name; document.getElementById('ubAv').textContent=USER.av;
  saveState(); toast('Profile saved.'); go('profile');
}
function openNotifLink(i){var n=NOTIFS[i]; if(!n)return; n.unread=false; saveState(); var l=n.link||{}; if(l.type==='app')go('app-detail',l.id); else if(l.type==='card')go('card-detail',l.id); else if(l.type==='event')go('events'); else go('notifications'); }
function delNotif(i){ NOTIFS.splice(i,1); saveState(); go('notifications'); toast('Notification deleted.'); }
function simulateApproval(id){
  var a=APPS.filter(function(x){return x.id===id;})[0]; if(!a)return;
  a.status='Approved';
  var pref=a.type==='Media License'?'ML':a.type==='Foreign Permit'?'FP':'PC';
  var cid=pref+'-2026-'+Math.floor(1000+Math.random()*8999);
  var exp=a.type==='Foreign Permit'?'20 Aug 2026':'31 Dec 2027';
  CARDS.unshift({id:cid,type:a.type,holder:a.name||USER.name,outlet:a.outlet||USER.outlet,status:'Active',expiry:exp,blood:USER.blood||'O+'});
  a.cardId=cid;
  NOTIFS.unshift({icon:'check',color:'green',t:'Application Approved',s:a.type+' '+a.id+' has been approved. Your card is ready.',tm:'just now',day:'Today',unread:true,link:{type:'card',id:cid}});
  saveState(); toast('Approved! Card issued.'); go('app-detail',id);
}
/* ============================ HELPERS ============================ */
function qrSVG(size){
  var n=21,cell=size/n,rects='';
  var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var finder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(finder)continue;
    if(rnd()>0.55)rects+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" rx="'+(cell*0.2)+'"/>';
  }
  function fnd(px,py){return '<rect x="'+px+'" y="'+py+'" width="'+(cell*7)+'" height="'+(cell*7)+'" rx="'+(cell)+'" fill="none" stroke="#0E2A3E" stroke-width="'+(cell*1.1)+'"/><rect x="'+(px+cell*2)+'" y="'+(py+cell*2)+'" width="'+(cell*3)+'" height="'+(cell*3)+'" rx="'+(cell*0.6)+'" fill="#0E2A3E"/>';}
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" fill="#0E2A3E">'+rects+fnd(0,0)+fnd(size-cell*7,0)+fnd(0,size-cell*7)+'</svg>';
}
function skeletonTable(elId,cb){
  var el=document.getElementById(elId);if(!el)return;
  el.innerHTML='<div style="padding:16px">'+[0,1,2,3].map(function(){return '<div style="display:flex;gap:12px;align-items:center;padding:10px 0"><div class="skel" style="width:80px;height:14px"></div><div class="skel" style="width:110px;height:14px"></div><div class="skel" style="width:70px;height:14px"></div><div class="skel" style="width:80px;height:22px;border-radius:20px;margin-left:auto"></div></div>';}).join('')+'</div>';
  setTimeout(function(){ if(document.getElementById(elId)) cb(); },650);
}
function skeletonCards(elId,cb){
  var el=document.getElementById(elId);if(!el)return;
  el.innerHTML=[0,1].map(function(){return '<div class="skel" style="height:170px;border-radius:18px"></div>';}).join('');
  setTimeout(function(){ if(document.getElementById(elId)) cb(); },650);
}
